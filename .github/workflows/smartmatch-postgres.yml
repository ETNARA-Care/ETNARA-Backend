name: SmartMatch isolated PostgreSQL security
on:
  pull_request:
    paths:
      - 'migrations/078_smartmatch_foundation.sql'
      - 'migrations/079_smartmatch_approval_invariants.sql'
      - 'migrations/080_smartmatch_agency_opportunity_rls.sql'
      - 'migrations/081_smartmatch_agency_application_review.sql'
      - 'scripts/smartmatch_*.sql'
      - '.github/workflows/smartmatch-postgres.yml'
  workflow_dispatch:
jobs:
  tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartmatch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartmatch_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: smartmatch_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap synthetic-only tables and roles
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/smartmatch_ci_fixture.sql
      - name: Apply SmartMatch migrations only
        run: |
          for migration in migrations/078_smartmatch_foundation.sql migrations/079_smartmatch_approval_invariants.sql migrations/080_smartmatch_agency_opportunity_rls.sql migrations/081_smartmatch_agency_application_review.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Insert synthetic opportunity
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO smartmatch_opportunities (id, organization_id, created_by_user_id, visibility, region_label, role_label, starts_at, ends_at) VALUES ('66666666-6666-4666-8666-666666666666','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','11111111-1111-4111-8111-111111111111','INTERNAL','Synthetic municipality','Caregiver',now() + interval '2 days',now() + interval '3 days')"
      - name: Insert synthetic application for Agency A
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO smartmatch_applications (id, opportunity_id, caregiver_user_id) VALUES ('88888888-8888-4888-8888-888888888888','66666666-6666-4666-8666-666666666666','22222222-2222-4222-8222-222222222222')"
      - name: Verify application review isolation
        run: |
          psql -X -v ON_ERROR_STOP=1 \\
            -v agency_a=aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa \\
            -v agency_b=bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb \\
            -v admin_a=11111111-1111-4111-8111-111111111111 \\
            -v admin_b=22222222-2222-4222-8222-222222222222 \\
            -v opportunity_a=66666666-6666-4666-8666-666666666666 \\
            -f scripts/smartmatch_application_rls_smoke.sql
      - name: Verify grants and forced RLS
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/smartmatch_privilege_gate.sql
      - name: Verify bidirectional agency isolation as app_runtime
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -v agency_a=aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa \
            -v agency_b=bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb \
            -v admin_a=11111111-1111-4111-8111-111111111111 \
            -v admin_b=22222222-2222-4222-8222-222222222222 \
            -v opportunity_a=66666666-6666-4666-8666-666666666666 \
            -f scripts/smartmatch_rls_demo_smoke.sql
