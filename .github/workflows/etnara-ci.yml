name: ETNARA CI

on:
  push:
    branches: [main, 'security/170-platform-phi-boundary']
  pull_request:
    branches: [main]

jobs:
  validate-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: etnara_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d etnara_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: PostgreSQL migration validation
        shell: bash
        run: |
          runtime_password="$(openssl rand -hex 24)"
          demo_password="$(openssl rand -hex 24)"
          platform_admin_password="$(openssl rand -hex 24)"
          export MIGRATIONS_DATABASE_URL="postgres://postgres@localhost:5432/etnara_ci"
          export APP_RUNTIME_PASSWORD="$runtime_password"
          export DEMO_PASSWORD="$demo_password"
          export PLATFORM_ADMIN_PASSWORD="$platform_admin_password"
          npm run bootstrap:staging
          npm run bootstrap:staging

      - name: PostgreSQL tenant isolation verification
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
        run: npx tsx scripts/verifyTenantIsolation.ts

      - name: Role authorization matrix, app connected as superuser (production today, RLS bypassed)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
          AUTHZ_DB_MODE: superuser
        run: npx tsx scripts/verifyRoleAuthorizationMatrix.ts

      - name: Role authorization matrix, app connected as app_runtime (RLS applies)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
          AUTHZ_DB_MODE: app_runtime
        run: npx tsx scripts/verifyRoleAuthorizationMatrix.ts

      - name: Non-member access guard, app as superuser (every organization route refuses with 4xx, never 2xx or 500)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
          AUTHZ_DB_MODE: superuser
        run: npx tsx scripts/verifyNonMemberAccess.ts

      - name: Non-member access guard, app as app_runtime
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
          AUTHZ_DB_MODE: app_runtime
        run: npx tsx scripts/verifyNonMemberAccess.ts

      - name: PostgreSQL platform PHI boundary verification
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifyPlatformPhiBoundary.ts

      - name: Caregiver access window (messaging 24 h, addresses only with an accepted current shift), app as superuser
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
          AUTHZ_DB_MODE: superuser
        run: npx tsx scripts/verifyCaregiverAccessWindow.ts

      - name: Caregiver access window, app as app_runtime
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
