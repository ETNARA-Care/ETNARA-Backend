name: ETNARA CI

on:
  push:
    branches: [main, 'security/170-platform-phi-boundary']
  pull_request:
    branches: [main]

jobs:
  validate-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: etnara_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d etnara_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: PostgreSQL migration validation
        shell: bash
        run: |
          runtime_password="$(openssl rand -hex 24)"
          demo_password="$(openssl rand -hex 24)"
          platform_admin_password="$(openssl rand -hex 24)"
          export MIGRATIONS_DATABASE_URL="postgres://postgres@localhost:5432/etnara_ci"
          export APP_RUNTIME_PASSWORD="$runtime_password"
          export DEMO_PASSWORD="$demo_password"
          export PLATFORM_ADMIN_PASSWORD="$platform_admin_password"
          npm run bootstrap:staging
          npm run bootstrap:staging

      - name: PostgreSQL tenant isolation verification
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
        run: npx tsx scripts/verifyTenantIsolation.ts

      - name: PostgreSQL platform PHI boundary verification
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifyPlatformPhiBoundary.ts

      - name: PostgreSQL credential review write boundary verification
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
        run: npx tsx scripts/verifyCredentialReviewWriteBoundary.ts

      - name: PostgreSQL SmartMatch RLS verification (app_runtime, synthetic)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifySmartMatchRls.ts

      - name: PostgreSQL SmartMatch decisions verification (HTTP, concurrency, synthetic)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifySmartMatchDecisions.ts

      - name: PostgreSQL SmartMatch two-agency end-to-end flow (HTTP, synthetic)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifySmartMatchTwoAgencyFlow.ts

      - name: PostgreSQL SmartMatch notifications verification (HTTP, synthetic)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifySmartMatchNotifications.ts

      - name: PostgreSQL SmartMatch to Turnos verification
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifySmartMatchShifts.ts

      - name: PostgreSQL Gate 6 service location verification (HTTP, synthetic)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifyGate6ServiceLocations.ts

      - name: PostgreSQL Gate 7 journey verification
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifyGate7Journey.ts

      - name: PostgreSQL En Camino cancel/reassign/offline verification
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifyEnCaminoFixes.ts

      - name: PostgreSQL security audit hardening verification
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifySecurityAudit.ts

      - name: PostgreSQL production security hotfix (088) verification
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifyProductionHotfix.ts

      - name: PostgreSQL SmartMatch pilot switches verification
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifyOrgFeatures.ts

      - name: PostgreSQL SmartMatch cancel + expiry verification
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifySmartMatchCancelExpiry.ts

      - name: PostgreSQL SmartMatch fixes (H1 conflicts + races, H2 overnight, H3, H4, reset tokens)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifySmartMatchFixes.ts

      - name: PostgreSQL SmartMatch fixes rollback (never reopens password_reset_tokens to PUBLIC)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifySmartMatchFixesRollback.ts

      - name: PostgreSQL check-out flow (regular + SmartMatch, visits open > 48 h, safe 500s)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifyCheckOutFlow.ts

      - name: PostgreSQL Finanzas F0 safe financial foundation (audit_log, finance_events, central deny, immutability, PR days)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifyFinanceFoundation.ts

      - name: PostgreSQL Finanzas F1 services and differentiated rates (catalogue, billing vs pay, exceptions, dates, overlaps, isolation)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifyFinanceServicesRates.ts

      - name: PostgreSQL activity photos security (isolation, tampering, approval, consent, ETNARA central)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifyActivityPhotoSecurity.ts

      - name: Local private S3 for photo tests (moto, never a hosted service)
        run: |
          python3 -m venv "$RUNNER_TEMP/moto-venv"
          "$RUNNER_TEMP/moto-venv/bin/pip" install --quiet "moto[server]==5.2.4"
          echo "PHOTO_TEST_PYTHON=$RUNNER_TEMP/moto-venv/bin/python" >> "$GITHUB_ENV"

      - name: PostgreSQL activity photos upload (EXIF removal, review, consent, family, concurrency)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifyActivityPhotoUpload.ts

      - name: Password recovery by e-mail (no enumeration, timing, single use, sessions closed)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifyPasswordRecovery.ts

      - name: PostgreSQL invitation activation verification
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
        run: npx tsx scripts/verifyAccessInvitationActivation.ts

      - name: PostgreSQL production security hotfix verification
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        run: npx tsx scripts/verifyProductionHotfix.ts

      - name: PostgreSQL caregiver-agency credential E2E
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
        shell: bash
        run: |
          runtime_password="$(openssl rand -hex 24)"
          psql "$MIGRATIONS_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE app_runtime PASSWORD '$runtime_password'"
          export DATABASE_URL="postgres://app_runtime:$runtime_password@localhost:5432/etnara_ci"
          npx tsx scripts/verifyCaregiverAgencyCredentialE2E.ts


      - name: Export/report security guard
        run: npx tsx scripts/verifyExportReportSecurity.ts

      - name: PostgreSQL HTTP and RLS verifications (seeded demo)
        env:
          MIGRATIONS_DATABASE_URL: postgres://postgres@localhost:5432/etnara_ci
          ETNARA_DISPOSABLE_DB: "true"
        shell: bash
        run: |
          # Seed once: seedDemo does not change passwords of users that already exist.
          runtime_password="$(openssl rand -hex 24)"
          demo_password="$(openssl rand -hex 24)"
          psql "$MIGRATIONS_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE app_runtime PASSWORD '$runtime_password'"
          DATABASE_URL="$MIGRATIONS_DATABASE_URL" DEMO_PASSWORD="$demo_password" npx tsx scripts/seedDemo.ts
          export DATABASE_URL="postgres://app_runtime:$runtime_password@localhost:5432/etnara_ci"
          export DEMO_PASSWORD="$demo_password"
          npx tsx scripts/verifyTenantPolicyClosure.ts
          npx tsx scripts/verifyOfflineCheckInOut.ts
          npx tsx scripts/verifyAssignmentMessagingSync.ts
          npx tsx scripts/verifyCareEventIdempotency.ts
          npx tsx scripts/verifyRecipientLocationAccess.ts
          npx tsx scripts/verifyTeamAndAdminAuthority.ts
          npx tsx scripts/verifyStaffRolesAndExistingAccounts.ts

      - name: Diff safety check
        run: git diff --check
